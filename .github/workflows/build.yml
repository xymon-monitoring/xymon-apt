name: build

# Mirrors xymon-monitoring/xymon-rpm's build.yml: lint, build per target,
# tests gate publishing, publish on request, deploy Pages in its own job.
# What is built: Debian's xymon source package pinned in source.dsc.sha256,
# plus backport/ patches -- an unofficial backport.
on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  # Weekly: catches a distro update that breaks the build or the install.
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:
    inputs:
      # A published version is immutable: after a change in backport/ (e.g. a
      # CVE fix) re-dispatch with this bumped, giving ~~xymonNN+2.
      releasenum:
        description: 'Rebuild number (bump to re-release the same Debian version)'
        required: false
        default: '1'
      publish:
        description: 'Set to 1 to publish the result'
        required: false
        default: ''

permissions:
  contents: read

env:
  RELEASENUM: ${{ github.event.inputs.releasenum || '1' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck the shell this repository owns
        run: |
          set -eu
          git ls-files | while read -r f; do
            head -1 "$f" | grep -qE '^#!.*/(env +)?(sh|bash|dash)$' && printf '%s\n' "$f"
          done > /tmp/shell-files
          [ -s /tmp/shell-files ] || { echo "no shell script found"; exit 1; }
          xargs shellcheck -S error < /tmp/shell-files

  deb:
    name: ${{ matrix.codename }}-${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      # Pinned codenames, never "stable"/"latest": a moving tag would move
      # the published suite underneath users with no commit to point at.
      matrix:
        image: [debian:bookworm, debian:trixie, ubuntu:noble]
        arch: [amd64, arm64]
        include:
          - {image: debian:bookworm, codename: bookworm}
          - {image: debian:trixie, codename: trixie}
          - {image: ubuntu:noble, codename: noble}
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: |
          docker run --rm -v "$PWD:/w" "${{ matrix.image }}" \
            /w/build-deb.sh /w/out "$RELEASENUM"

      - name: Install test (fresh)
        run: docker run --rm -v "$PWD:/w:ro" "${{ matrix.image }}" /w/tests/install.sh /w/out fresh

      - name: Install test (upgrade from the distro's official xymon)
        run: docker run --rm -v "$PWD:/w:ro" "${{ matrix.image }}" /w/tests/install.sh /w/out upgrade

      - uses: actions/upload-artifact@v4
        with:
          name: pub-${{ matrix.codename }}-${{ matrix.arch }}
          # dbgsym packages left out: ~10x the size, rarely wanted
          path: |
            out/xymon_*.deb
            out/xymon-client_*.deb
          if-no-files-found: error

  # The container jobs above have no PID 1, so the maintainer scripts' systemd
  # calls no-op there. One target is enough: the units are the same everywhere.
  systemd:
    runs-on: ubuntu-latest
    needs: deb
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: pub-trixie-amd64
          path: out
      - name: Run the systemd test
        run: |
          set -eux
          docker build -t xymon-systemd - <<'EOF'
          FROM debian:trixie
          # The image's policy-rc.d (exit 101) stops maintainer scripts
          # starting services -- the very thing under test.
          RUN apt-get update && apt-get install -y systemd systemd-sysv && apt-get clean \
              && printf '#!/bin/sh\nexit 0\n' > /usr/sbin/policy-rc.d
          CMD ["/sbin/init"]
          EOF
          docker run -d --name sd --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD:/w:ro" xymon-systemd
          for _ in $(seq 30); do
            state=$(docker exec sd systemctl is-system-running 2>/dev/null || true)
            case "$state" in running|degraded) break ;; esac
            sleep 2
          done
          docker exec sd /w/tests/systemd.sh /w/out
      - if: always()
        run: docker rm -f sd || true

  publish:
    needs: [lint, deb, systemd]
    # Only a deliberate, dispatched build from main: a pull request never
    # reaches the key, and a push/cron rebuild must not overwrite a published
    # version with different bytes.
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.publish == '1'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    outputs:
      ok: ${{ steps.key.outputs.ok }}
    steps:
      - uses: actions/checkout@v6

      # Same key as xymon-rpm (secret GPG_PRIVATE_KEY). No key (a fork):
      # stay green and publish nothing.
      - name: Check for a signing key
        id: key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::No GPG_PRIVATE_KEY secret; nothing published."; fi

      - name: Import the signing key
        if: steps.key.outputs.ok == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          pattern: pub-*
          path: artifacts

      - name: Build the signed repository
        if: steps.key.outputs.ok == 'true'
        run: |
          set -eu
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y apt-utils
          for d in artifacts/pub-*; do
            c=$(basename "$d" | cut -d- -f2)
            mkdir -p "debs/$c" && cp "$d"/*.deb "debs/$c/"
          done
          ./make-repo.sh debs site "$KEYID"
          gpg --armor --export "$KEYID" > site/xymon-archive-keyring.asc
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: steps.key.outputs.ok == 'true'
        with:
          path: site

  # Its own job: the github-pages environment can refuse a deployment, and a
  # refusal blocks a whole job. Needs Settings > Pages > Source: GitHub Actions.
  pages:
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
